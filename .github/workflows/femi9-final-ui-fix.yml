name: Femi9 final UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply final fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('src/screens/Home.tsx')
          text = home.read_text()
          old = "const buyNow = () => document.querySelector('#products')?.scrollIntoView({ behavior: 'smooth' })"
          new = "const buyNow = () => { window.location.href = '/product/p330dw' }"
          if old in text:
              text = text.replace(old, new, 1)
              home.write_text(text)
          elif "window.location.href = '/product/p330dw'" not in text:
              raise SystemExit('Hero Buy Now handler not found; refusing unsafe edit.')

          pdp = Path('src/styles/pdp-buybox.css')
          css = pdp.read_text()
          marker = '/* FINAL: disable nested PDP scrolling; let the document own vertical scroll. */'
          if marker not in css:
              css += '''\n\n/* FINAL: disable nested PDP scrolling; let the document own vertical scroll. */\n@media (min-width:921px) {\n  .pdp-page .pdp-right-col {\n    position: static !important;\n    top: auto !important;\n    max-height: none !important;\n    overflow: visible !important;\n    overscroll-behavior: auto !important;\n    scrollbar-width: auto !important;\n  }\n  .pdp-page .pdp-right-col::-webkit-scrollbar { width: auto; }\n}\n'''
              pdp.write_text(css)
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/femi9-final-ui-fix.yml
          git add src/screens/Home.tsx src/styles/pdp-buybox.css
          git add -f -u .github/workflows/femi9-final-ui-fix.yml
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git commit -m 'fix: finalize hero CTA and remove nested PDP scroll'
          git push origin main
